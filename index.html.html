<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speak &amp; Predict – Student Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #f0f4ff;
  --surface:      #ffffff;
  --surface-soft: #f7f9ff;
  --orange:       #f97316;
  --orange-hover: #ea6c0a;
  --orange-light: #fff4ed;
  --orange-glow:  rgba(249,115,22,0.22);
  --purple:       #6d4fc2;
  --purple-hover: #5a3faa;
  --purple-light: #f0ecfb;
  --purple-glow:  rgba(109,79,194,0.25);
  --teal:         #0ea5e9;
  --text-primary: #131125;
  --text-secondary:#5a5470;
  --text-muted:   #9590aa;
  --border:       rgba(0,0,0,0.07);
  --shadow-sm:    0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:    0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg:    0 12px 40px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.05);
  --radius-card:  24px;
  --radius-pill:  100px;
  --radius-box:   16px;
  --font:         'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

html, body {
  min-height: 100vh;
  font-family: var(--font);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 65% 50% at 10% 10%, rgba(109,79,194,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 55% 65% at 90% 90%, rgba(14,165,233,0.07) 0%, transparent 60%);
  pointer-events: none;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border-radius: var(--radius-card);
  padding: 44px 48px 48px;
  width: min(480px, 100%);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
  position: relative;
  text-align: center;
  transition: box-shadow 0.5s ease;
}

.card.is-open {
  box-shadow:
    var(--shadow-lg),
    0 0 0 1px rgba(109,79,194,0.12),
    0 0 56px rgba(109,79,194,0.07);
}

/* ── BRAND HEADER ── */
.brand-header { margin-bottom: 32px; }

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--purple-light);
  border: 1px solid rgba(109,79,194,0.18);
  border-radius: var(--radius-pill);
  padding: 5px 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--purple);
  margin-bottom: 16px;
}

.brand-badge::before { content: '◉'; font-size: 8px; }

.brand-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  line-height: 1.2;
  margin-bottom: 6px;
}

.brand-title span { color: var(--purple); }

.brand-subtitle {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.01em;
}

/* ── DIVIDER ── */
.divider {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--border), transparent);
  margin: 0 -8px;
}

/* ── COOKIE STAGE ── */
.cookie-stage-wrap { padding: 28px 0 20px; }

.cookie-stage {
  position: relative;
  width: 200px;
  height: 200px;
  margin: 0 auto;
  cursor: pointer;
}

.cookie-shadow {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 16px;
  background: radial-gradient(ellipse, rgba(80,50,140,0.14) 0%, transparent 70%);
  border-radius: 50%;
  animation: shadow-float 3.4s ease-in-out infinite;
  pointer-events: none;
}

@keyframes shadow-float {
  0%,100% { transform: translateX(-50%) scaleX(1) scaleY(1); opacity: 0.8; }
  50%      { transform: translateX(-50%) scaleX(0.7) scaleY(0.55); opacity: 0.35; }
}

.cookie-glow-ring {
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--purple-glow) 0%, transparent 65%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}

.cookie-stage.glowing .cookie-glow-ring { opacity: 1; }

.cookie-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: opacity 0.38s ease, transform 0.22s ease;
}

.cookie-img.hidden { opacity: 0; pointer-events: none; }

#cookie-closed { animation: idle-float 3.4s ease-in-out infinite; }

@keyframes idle-float {
  0%,100% { transform: translateY(0px) rotate(-1deg); }
  50%      { transform: translateY(-10px) rotate(1deg); }
}

.cookie-stage:not(.open-state):hover #cookie-closed {
  animation: hover-shake 0.5s ease-in-out infinite;
}

@keyframes hover-shake {
  0%,100% { transform: rotate(-2deg) translateY(-2px); }
  25%      { transform: rotate(2.5deg) translateX(3px); }
  50%      { transform: rotate(-2deg) translateY(-5px); }
  75%      { transform: rotate(2deg) translateX(-3px); }
}

.cookie-stage.pressing #cookie-closed {
  animation: none !important;
  transform: scale(0.90) !important;
  transition: transform 0.12s ease;
}

/* ── FORTUNE COUNTER ── */
.fortune-counter {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  height: 18px;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.fortune-counter.visible { opacity: 1; }

/* ── INITIAL STATE ── */
.initial-section {
  padding-top: 24px;
  transition: opacity 0.3s ease;
}

.initial-label {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 24px;
}

/* ── FORTUNE PANEL ── */
.fortune-panel {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 0;
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  padding-top: 8px;
}

.fortune-panel.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Fortune reveal box */
.fortune-box {
  width: 100%;
  background: var(--surface-soft);
  border: 1px solid rgba(109,79,194,0.13);
  border-radius: var(--radius-box);
  padding: 24px 28px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.fortune-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(to right, var(--purple), var(--teal));
  border-radius: 2px 2px 0 0;
}

.fortune-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--purple);
  margin-bottom: 12px;
}

.fortune-tag::before {
  content: '';
  display: inline-block;
  width: 14px; height: 1.5px;
  background: var(--purple);
  opacity: 0.5;
}

.fortune-tag::after {
  content: '';
  display: inline-block;
  width: 14px; height: 1.5px;
  background: var(--purple);
  opacity: 0.5;
}

.fortune-text {
  font-size: 17px;
  font-weight: 400;
  color: var(--text-primary);
  line-height: 1.65;
  text-align: center;
}

/* ── LUCKY NUMBERS ── */
.lucky-section {
  width: 100%;
  margin-bottom: 28px;
}

.lucky-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 14px;
}

.numbers-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.num-badge {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--purple);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.4) translateY(10px);
  transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 3px 10px rgba(109,79,194,0.30);
}

.num-badge.pop {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* ── BUTTONS ── */
.actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: var(--radius-pill);
  padding: 14px 32px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  width: 100%;
  max-width: 320px;
}

.btn-primary {
  background: var(--purple);
  color: #fff;
  box-shadow: 0 4px 14px rgba(109,79,194,0.35);
}

.btn-primary:hover {
  background: var(--purple-hover);
  transform: translateY(-2px);
  box-shadow: 0 7px 20px rgba(109,79,194,0.42);
}

.btn-primary:active {
  transform: scale(0.97);
  box-shadow: 0 2px 8px rgba(109,79,194,0.3);
}

.btn-secondary {
  background: transparent;
  color: var(--text-secondary);
  border: 1.5px solid var(--border);
  box-shadow: none;
}

.btn-secondary:hover {
  background: var(--surface-soft);
  border-color: rgba(0,0,0,0.12);
  color: var(--text-primary);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.btn-secondary:active { transform: scale(0.97); }

/* ── FOOTER ── */
.card-footer {
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}

.footer-text {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

/* ── PARTICLES ── */
#particle-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
}

.state-hidden { display: none !important; }

  /* ── RESPONSIVE / MOBILE ── */
  @media (max-width: 600px) {
    html, body {
      padding: 0;
      align-items: flex-start;
      background: var(--surface);
    }

    body::before { display: none; }

    .card {
      width: 100%;
      min-height: 100dvh;
      border-radius: 0;
      padding: 36px 24px 40px;
      box-shadow: none;
      border: none;
      display: flex;
      flex-direction: column;
    }

    .card.is-open { box-shadow: none; }

    .brand-header { margin-bottom: 24px; }

    .brand-title { font-size: 24px; }

    .cookie-stage-wrap { padding: 20px 0 14px; }

    .cookie-stage {
      width: 170px;
      height: 170px;
    }

    .fortune-counter { margin-bottom: 4px; }

    .initial-section { padding-top: 18px; }

    .initial-label { font-size: 14px; margin-bottom: 20px; }

    .fortune-box { padding: 20px 20px; margin-bottom: 20px; }

    .fortune-text { font-size: 16px; line-height: 1.6; }

    .lucky-section { margin-bottom: 22px; }

    .num-badge { width: 40px; height: 40px; font-size: 13px; }

    .numbers-row { gap: 8px; }

    .btn { padding: 13px 28px; font-size: 14px; max-width: 100%; }

    .actions { gap: 8px; }

    .card-footer { margin-top: 24px; padding-top: 16px; }

    .footer-text { font-size: 10px; }
  }

  @media (max-width: 380px) {
    .card { padding: 28px 18px 32px; }
    .brand-title { font-size: 22px; }
    .cookie-stage { width: 150px; height: 150px; }
    .fortune-text { font-size: 15px; }
    .num-badge { width: 36px; height: 36px; font-size: 12px; }
    .numbers-row { gap: 6px; }
  }

  /* Tall phones — give cookie more room */
  @media (min-height: 800px) and (max-width: 600px) {
    .cookie-stage { width: 190px; height: 190px; }
  }
</style>
</head>

  "Your effort today is your success tomorrow.",
  "Keep going — something is working.",
  "Growth happens when you don't give up.",
  "Every learner has their own rhythm.",
  "Small habits create big results.",
  "The more you practice, the easier it feels.",
  "You are building something important.",
  "Your journey is uniquely yours.",
  "One step forward is still forward.",
  "Learning opens doors you haven't seen yet.",
  "Your dedication will reward you.",
  "Keep showing up — that is your power.",
  "Today's effort becomes tomorrow's confidence."
];

let lastIdx = -1;
let isOpen = false;
let fortuneCount = 0;

const card         = document.getElementById('card');
const cookieStage  = document.getElementById('cookieStage');
const cookieClosed = document.getElementById('cookie-closed');
const cookieOpen   = document.getElementById('cookie-open');
const initialText  = document.getElementById('initialText');
const fortunePanel = document.getElementById('fortunePanel');
const fortuneText  = document.getElementById('fortuneText');
const numbersRow   = document.getElementById('numbersRow');
const openBtn      = document.getElementById('openBtn');
const anotherBtn   = document.getElementById('anotherBtn');
const closeBtn     = document.getElementById('closeBtn');
const counter      = document.getElementById('fortuneCounter');

// ── AUDIO ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playClick() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.setValueAtTime(820, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(340, audioCtx.currentTime + 0.12);
  gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
  osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

function playReveal() {
  ensureAudio();
  const bufSize = audioCtx.sampleRate * 0.18;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 3800;
  filter.Q.value = 0.8;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start();
  setTimeout(() => {
    const osc2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    osc2.connect(g2); g2.connect(audioCtx.destination);
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc2.frequency.exponentialRampToValueAtTime(1100, audioCtx.currentTime + 0.12);
    g2.gain.setValueAtTime(0.09, audioCtx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc2.start(); osc2.stop(audioCtx.currentTime + 0.42);
  }, 120);
}

// ── PARTICLES ──
const canvas = document.getElementById('particle-canvas');
const ctx    = canvas.getContext('2d');
let particles = [];
let raf;

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function spawnParticles(x, y) {
  const symbols = ['✦','✧','·','◆','★'];
  const colors  = ['#6d4fc2','#a78bfa','#7c5cbf','#0ea5e9','#c4b5fd'];
  for (let i = 0; i < 26; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.6 + Math.random() * 3.6;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.0,
      alpha: 1,
      size: 9 + Math.random() * 12,
      symbol: symbols[Math.floor(Math.random() * symbols.length)],
      color: colors[Math.floor(Math.random() * colors.length)],
      decay: 0.016 + Math.random() * 0.012,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.12
    });
  }
  if (!raf) animateParticles();
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.alpha > 0.02);
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle   = p.color;
    ctx.font        = `${p.size}px serif`;
    ctx.textAlign   = 'center';
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.fillText(p.symbol, 0, 0);
    ctx.restore();
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.09;
    p.alpha -= p.decay;
    p.rotation += p.rotSpeed;
    p.vx *= 0.98;
  }
  if (particles.length > 0) {
    raf = requestAnimationFrame(animateParticles);
  } else {
    raf = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

function getCookieCenter() {
  const r = cookieStage.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function pickFortune() {
  let idx;
  do { idx = Math.floor(Math.random() * FORTUNES.length); } while (idx === lastIdx);
  lastIdx = idx;
  return FORTUNES[idx];
}

function pickNumbers() {
  const nums = new Set();
  while (nums.size < 5) nums.add(Math.floor(Math.random() * 99) + 1);
  return [...nums];
}

function animateNumbers(nums) {
  numbersRow.innerHTML = '';
  nums.forEach((n, i) => {
    const badge = document.createElement('div');
    badge.className = 'num-badge';
    badge.textContent = n;
    numbersRow.appendChild(badge);
    setTimeout(() => badge.classList.add('pop'), 320 + i * 120);
  });
}

function updateCounter() {
  counter.textContent = `Message #${fortuneCount} of today`;
  counter.classList.add('visible');
}

function openCookie() {
  if (isOpen) return;
  isOpen = true;
  playClick();
  cookieStage.classList.add('pressing');

  setTimeout(() => {
    cookieStage.classList.remove('pressing');
    cookieStage.classList.add('glowing', 'open-state');
    card.classList.add('is-open');
    playReveal();

    cookieClosed.classList.add('hidden');
    cookieOpen.classList.remove('hidden');

    const center = getCookieCenter();
    spawnParticles(center.x, center.y);

    initialText.style.opacity = '0';
    initialText.style.pointerEvents = 'none';

    setTimeout(() => {
      initialText.classList.add('state-hidden');
      fortuneCount++;
      updateCounter();
      fortuneText.textContent = pickFortune();
      animateNumbers(pickNumbers());
      fortunePanel.style.display = 'flex';
      requestAnimationFrame(() => requestAnimationFrame(() =>
        fortunePanel.classList.add('visible')
      ));
    }, 340);
  }, 220);
}

function anotherFortune() {
  playClick();
  fortunePanel.classList.remove('visible');
  setTimeout(() => {
    fortuneCount++;
    updateCounter();
    fortuneText.textContent = pickFortune();
    animateNumbers(pickNumbers());
    const center = getCookieCenter();
    spawnParticles(center.x, center.y);
    requestAnimationFrame(() => requestAnimationFrame(() =>
      fortunePanel.classList.add('visible')
    ));
  }, 290);
}

function closeCookie() {
  isOpen = false;
  playClick();

  fortunePanel.classList.remove('visible');
  setTimeout(() => { fortunePanel.style.display = 'none'; }, 500);

  card.classList.remove('is-open');
  cookieStage.classList.remove('glowing', 'open-state');
  cookieOpen.classList.add('hidden');
  cookieClosed.classList.remove('hidden');
  counter.classList.remove('visible');

  initialText.classList.remove('state-hidden');
  initialText.style.opacity = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    initialText.style.transition = 'opacity 0.42s ease';
    initialText.style.opacity = '1';
    initialText.style.pointerEvents = '';
  }));
}

openBtn.addEventListener('click', openCookie);
cookieStage.addEventListener('click', () => { if (!isOpen) openCookie(); });
anotherBtn.addEventListener('click', anotherFortune);
closeBtn.addEventListener('click', closeCookie);
</script>
